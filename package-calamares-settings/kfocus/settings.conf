---
modules-search: [ local ]

instances:
- id: before_bootloader_kerncopy
  module: shellprocess
  config: shellprocess_before_bootloader_kerncopy.conf
- id: before_bootloader
  module: contextualprocess
  config: before_bootloader_context.conf
- id: logs
  module: shellprocess
  config: shellprocess_logs.conf
- id: bug-LP#1829805
  module: shellprocess
  config: shellprocess_bug-LP#1829805.conf
- id: add386arch
  module: shellprocess
  config: shellprocess_add386arch.conf
- id: oemprep
  module: shellprocess
  config: shellprocess_oemprep.conf
- id: fixconkeys_part1
  module: shellprocess
  config: shellprocess_fixconkeys_part1.conf
- id: fixconkeys_part2
  module: shellprocess
  config: shellprocess_fixconkeys_part2.conf
- id: kfocus-prep-user
  module: shellprocess
  config: shellprocess_kfocus_prep_user.conf
- id: enable-luks-discard
  module: shellprocess
  config: shellprocess_enable_luks_discard.conf
- id: fix-oem-uid
  module: shellprocess
  config: shellprocess_fix_oem_uid.conf
- id: rmcdrom
  module: shellprocess
  config: shellprocess_rmcdrom.conf

sequence:
- show:
  - welcome
  - integrity
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@before_bootloader_kerncopy
  - shellprocess@bug-LP#1829805
  - shellprocess@enable-luks-discard
  - shellprocess@fixconkeys_part1
  - shellprocess@fixconkeys_part2
  - initramfscfg
  - initramfs
  - grubcfg
  - contextualprocess@before_bootloader
  - bootloader
  - shellprocess@add386arch
  - automirror
  - shellprocess@kfocus-prep-user
  - packages
  - shellprocess@rmcdrom
  - shellprocess@logs
  - umount
- show:
  - finished

branding: kubuntu
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
