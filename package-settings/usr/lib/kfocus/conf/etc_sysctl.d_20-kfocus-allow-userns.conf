# Starting in Ubuntu 24.04 and confirmed in 26.04 on 2026-05-07, Ubuntu
# restricts the use of unprivileged user namespaces, which can cause
# significant problems (i.e., crashes) with certain applications that use
# sandboxing. Applications that use Electron are particularly likely to be
# affected (balenaEtcher being a prominent example). Until apps stop needing
# privileged user namespaces in general, this is unacceptable for KFocus
# machines, and this restriction has been disabled as a result.
kernel.apparmor_restrict_unprivileged_userns=0
