#   However, we might try setting it to 0 to see if there is a benefit.
#
#   At present, the issues with the 570 drivers include:
#   1. When the BIOS display is dynamic and nvidia output is routed through
#      the Intel graphics buffer, refresh rates > 60 Hz results in flashing.
#   2. In the same mode, occassionally the sleep-resume results in a black
#      screen with a cursor. VTs are available; restarting SDDM is the only
#      way to recover the display.
#   3. When the BIOS display setting is 'discrete-only', suspend-resume 
#      results in a black screen and VTs are not available.
